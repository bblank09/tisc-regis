<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TISC 2026 Onsite Registration</title>
  <meta name="description" content="TISC 2026 Onsite Registration — Semi-Final Round, 4 October 2026">
  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --accent:#111827;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .card{
      width:min(100%,560px);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:40px 28px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.05);
    }
    .eyebrow{
      font-size:14px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:14px;
    }
    h1{
      margin:0;
      font-size:clamp(30px,7vw,46px);
      line-height:1.05;
      letter-spacing:-.03em;
    }
    h2{
      margin:12px 0 0;
      font-size:clamp(20px,5vw,28px);
      font-weight:650;
    }
    .meta{
      margin:28px 0 0;
      font-size:17px;
      line-height:1.7;
    }
    .status{
      margin:30px auto 0;
      padding:16px 18px;
      border:1px solid var(--border);
      border-radius:14px;
      color:var(--muted);
      line-height:1.6;
    }
    .footer{
      margin-top:24px;
      font-size:13px;
      color:#9ca3af;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">TISC 2026</div>
    <h1>Onsite Registration</h1>
    <h2>Semi-Final Round</h2>
    <div class="meta">
      <strong>4 October 2026</strong><br>
      Registration · Floor 6
    </div>
    <div class="status">
      ระบบลงทะเบียนกำลังเตรียมพร้อม<br>
      Registration system is being prepared.
    </div>
    <div class="footer">Please return to this page on event day.</div>
  </main>
</body>
</html>
